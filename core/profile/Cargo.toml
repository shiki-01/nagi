[package]
name = "nagi-profile"
description = "Nagi 環境プロファイル: ハードウェア検出・キャリブレーション・自動切替の判定。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# OS 問い合わせ（デスクトップ既定）。モバイルでは無効にして、ホストが initialize で渡す値を使う
sysinfo = { version = "0.38.4", optional = true }

[features]
default = ["sysinfo"]
# `SysinfoSource` / `detect` が sysinfo で搭載メモリを調べる。無効時は保守的な既定値
sysinfo = ["dep:sysinfo"]

[lints]
workspace = true
