[package]
name = "nagi-server"
description = "Nagi サーバー: stdin/stdout の改行区切り JSON-RPC ループ（imserver バイナリ）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "imserver"
path = "src/main.rs"

[[bin]]
name = "nagi-eval"
path = "src/bin/nagi_eval.rs"

[dependencies]
nagi-engine.workspace = true
nagi-fuzzy.workspace = true
nagi-romaji.workspace = true
nagi-protocol.workspace = true
nagi-dict.workspace = true
nagi-infer.workspace = true
nagi-config.workspace = true
nagi-learn.workspace = true
nagi-profile.workspace = true
nagi-rewriter.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2.11", features = ["json"] }
ed25519-dalek = "2"
sha2 = "0.10"

[features]
# 既定で mmap 辞書（`Dictionary::load_mmap`）を使う。デスクトップ・モバイル共通
default = ["mmap"]
mmap = ["nagi-dict/mmap"]
# llama.cpp による zenz 推論（C++ ビルドが必要。リリースビルドでは有効にする）
llama = ["nagi-infer/llama"]

[lints]
workspace = true
