[package]
name = "nagi-infer"
description = "Nagi 推論層: 変換モデルを trait で隠蔽し、llama.cpp（GGUF）を feature で提供する。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"

[dependencies.llama-cpp-2]
version = "=0.1.157"
optional = true

[features]
llama = ["dep:llama-cpp-2"]

[lints.rust]
# ワークスペース既定は forbid（G-2）。infer の llama FFI 境界（feature `llama`）だけ、
# コンテキストの自己参照的な再利用のために解禁する（G-2 で許容済み、詳細は decisions.md G-11）
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
