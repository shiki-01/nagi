[package]
name = "nagi-ffi"
description = "Nagi コアエンジンの C ABI ラッパー（iOS 等での利用用）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# cdylib は不要（iOS は staticlib を XCFramework に入れる）。cdylib は rustc が -nodefaultlibs でリンクし、
# llama.cpp(Metal) の ___isPlatformVersionAtLeast（compiler-rt）が未解決になるため含めない
crate-type = ["staticlib", "rlib"]

[dependencies]
# update-check（ureq/rustls/ring）を外す: docs/ios-release.md §0.2
nagi-server = { path = "../server", default-features = false }
serde_json = { workspace = true }

[features]
# LLM 推論（zenz）を含む。llama.cpp の C++ ビルドが必要
llama = ["nagi-server/llama"]

[lints]
# FFI クレートは unsafe が必須なため、workspace の forbid を override
rust.unsafe_code = "allow"
rust.missing_docs = "warn"
clippy.all = { level = "warn", priority = -1 }
