[package]
name = "nagi-ffi"
description = "Nagi コアエンジンの C ABI ラッパー（iOS 等での利用用）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
nagi-server = { path = "../server", default-features = false }
serde_json = { workspace = true }

[features]
# 辞書の mmap 読み込み（既定で有効。iOS キーボード拡張のメモリ上限対策）
default = ["mmap"]
mmap = ["nagi-server/mmap"]
# LLM 推論（zenz）を含む。llama.cpp の C++ ビルドが必要
llama = ["nagi-server/llama"]

[lints]
# FFI クレートは unsafe が必須なため、workspace の forbid を override
rust.unsafe_code = "allow"
rust.missing_docs = "warn"
clippy.all = { level = "warn", priority = -1 }
