[package]
name = "nagi-dict"
description = "Nagi 辞書: Mozc OSS 辞書の読み込み・double-array trie・連接コスト・Viterbi。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fst = "0.4.7"
thiserror = { workspace = true }

# 非 Windows ではマップ中のファイルの置換に制約が無いため mmap を使う（dictionary.rs 先頭の注意）
[target.'cfg(not(windows))'.dependencies]
memmap2 = "0.9"

[lints.rust]
# ワークスペース既定は forbid（G-2）。辞書ファイルの mmap（dictionary.rs の map_file 1 箇所）だけ解禁する
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
