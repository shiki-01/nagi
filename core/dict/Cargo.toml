[package]
name = "nagi-dict"
description = "Nagi 辞書: Mozc OSS 辞書の読み込み・double-array trie・連接コスト・Viterbi。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fst = "0.4.7"
memmap2 = "0.9"
thiserror = { workspace = true }

# ワークスペースは unsafe_code = "forbid" だが、このクレートだけ mmap のために
# `buffer.rs` の 1 箇所で allow する（forbid は下位で緩められないため deny にしている）
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
