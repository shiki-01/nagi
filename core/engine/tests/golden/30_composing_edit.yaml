- name: composing-backspace-pending
  steps:
    - key: "k"
      expect: {preedit: "k", pending: "k"}
    - key: "BackSpace"
      expect: {preedit: "", pending: "", state: direct}

- name: composing-backspace-partial-pending
  steps:
    - key: "k"
      expect: {pending: "k"}
    - key: "y"
      expect: {preedit: "ky", pending: "ky"}
    - key: "BackSpace"
      expect: {preedit: "k", pending: "k"}

- name: composing-backspace-committed
  steps:
    - key: "k"
      expect: {pending: "k"}
    - key: "a"
      expect: {preedit: "か", pending: "", segments: ["か"]}
    - key: "BackSpace"
      expect: {preedit: "", state: direct}

- name: composing-backspace-multi-segment
  steps:
    - key: "k"
      expect: {pending: "k"}
    - key: "a"
      expect: {preedit: "か", segments: ["か"]}
    - key: "n"
      expect: {preedit: "かn", pending: "n"}
    - key: "a"
      expect: {preedit: "かな", segments: ["かな"]}
    - key: "BackSpace"
      expect: {preedit: "か", pending: "", segments: ["か"]}
    - key: "BackSpace"
      expect: {preedit: "", state: direct}

- name: composing-delete-after-pending
  steps:
    - key: "k"
      expect: {pending: "k"}
    - key: "a"
      expect: {preedit: "か"}
    - key: "n"
      expect: {pending: "n", cursor: 2}
    - key: "Delete"
      expect: {preedit: "かん", pending: "", cursor: 2}

- name: composing-delete-in-middle
  steps:
    - key: "k"
      expect: {pending: "k"}
    - key: "a"
      expect: {preedit: "か", cursor: 1}
    - key: "n"
      expect: {preedit: "かn", cursor: 2, pending: "n"}
    - key: "a"
      expect: {preedit: "かな", cursor: 2, pending: ""}
    - key: "Left"
      expect: {preedit: "かな", cursor: 1, pending: ""}
    - key: "Delete"
      expect: {preedit: "か", cursor: 1, pending: ""}

- name: composing-cursor-left-from-end
  steps:
    - key: "k"
      expect: {cursor: 1, pending: "k"}
    - key: "a"
      expect: {preedit: "か", cursor: 1}
    - key: "n"
      expect: {cursor: 2, pending: "n"}
    - key: "a"
      expect: {preedit: "かな", cursor: 2}
    - key: "Left"
      expect: {preedit: "かな", cursor: 1, pending: ""}

- name: composing-cursor-left-preserves-pending
  steps:
    - key: "k"
      expect: {pending: "k"}
    - key: "y"
      expect: {pending: "ky", cursor: 2}
    - key: "Left"
      expect: {preedit: "ky", cursor: 1, pending: ""}

- name: composing-cursor-right-advance
  steps:
    - key: "k"
      expect: {cursor: 1, pending: "k"}
    - key: "a"
      expect: {preedit: "か", cursor: 1}
    - key: "Left"
      expect: {cursor: 0}
    - key: "Right"
      expect: {cursor: 1}

- name: composing-cursor-home
  steps:
    - key: "k"
      expect: {cursor: 1}
    - key: "a"
      expect: {cursor: 1}
    - key: "n"
      expect: {cursor: 2, pending: "n"}
    - key: "a"
      expect: {cursor: 2}
    - key: "Home"
      expect: {cursor: 0, preedit: "かな", pending: ""}

- name: composing-cursor-ctrl-a
  steps:
    - key: "k"
      expect: {cursor: 1}
    - key: "a"
      expect: {cursor: 1}
    - key: "n"
      expect: {cursor: 2}
    - key: "a"
      expect: {cursor: 2}
    - key: "Ctrl+a"
      expect: {cursor: 0}

- name: composing-cursor-end
  steps:
    - key: "k"
      expect: {cursor: 1}
    - key: "a"
      expect: {cursor: 1}
    - key: "n"
      expect: {cursor: 2}
    - key: "a"
      expect: {cursor: 2}
    - key: "Home"
      expect: {cursor: 0}
    - key: "End"
      expect: {cursor: 2, preedit: "かな", pending: ""}

- name: composing-cursor-ctrl-e
  steps:
    - key: "k"
      expect: {cursor: 1}
    - key: "a"
      expect: {cursor: 1}
    - key: "Home"
      expect: {cursor: 0}
    - key: "Ctrl+e"
      expect: {cursor: 1}

- name: composing-insert-in-middle
  steps:
    - key: "k"
      expect: {cursor: 1}
    - key: "a"
      expect: {preedit: "か", cursor: 1}
    - key: "n"
      expect: {cursor: 2, pending: "n"}
    - key: "a"
      expect: {preedit: "かな", cursor: 2}
    - key: "Left"
      expect: {cursor: 1, pending: ""}
    - key: "u"
      expect: {preedit: "かうな", cursor: 2, segments: ["かうな"]}

- name: composing-delete-empty
  steps:
    - key: "Delete"
      expect: {consumed: false}

- name: composing-backspace-with-literal
  steps:
    - key: "A"
      expect: {preedit: "A", segments: ["A"], kinds: ["literal"]}
    - key: "BackSpace"
      expect: {preedit: "", state: direct}

- name: composing-escape-no-commit
  steps:
    - key: "k"
      expect: {state: composing}
    - key: "a"
      expect: {state: composing}
    - key: "Escape"
      expect: {commit: null, preedit: "", state: direct}

- name: composing-f7-to-katakana
  steps:
    - key: "k"
      expect: {state: composing}
    - key: "a"
      expect: {state: composing}
    - key: "F7"
      expect: {state: converting}

- name: composing-f6-to-hiragana
  steps:
    - key: "k"
      expect: {state: composing}
    - key: "a"
      expect: {state: composing}
    - key: "F6"
      expect: {state: converting}

- name: composing-ctrl-k-to-katakana
  steps:
    - key: "k"
      expect: {state: composing}
    - key: "a"
      expect: {state: composing}
    - key: "Ctrl+k"
      expect: {state: converting}

- name: composing-meta-c-commit-passthrough
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Meta+c"
      expect: {commit: "あ", state: direct, consumed: false}

- name: composing-up-noop
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Up"
      expect: {consumed: true, state: composing, preedit: "あ", result_preedit_present: false}

- name: composing-down-noop
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Down"
      expect: {consumed: true, state: composing, result_preedit_present: false}

- name: composing-tab-noop
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Tab"
      expect: {consumed: true, state: composing, result_preedit_present: false}

- name: composing-pageup-noop
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "PageUp"
      expect: {consumed: true, state: composing}

- name: composing-ctrl-h-backspace
  steps:
    - key: "k"
      expect: {pending: "k"}
    - key: "a"
      expect: {preedit: "か"}
    - key: "Ctrl+h"
      expect: {preedit: "", state: direct}

- name: composing-pending-with-cursor-left
  steps:
    - key: "k"
      expect: {cursor: 1, pending: "k"}
    - key: "y"
      expect: {pending: "ky", cursor: 2}
    - key: "o"
      expect: {preedit: "きょ", cursor: 2, pending: ""}
    - key: "u"
      expect: {preedit: "きょう", cursor: 3, pending: ""}
    - key: "Left"
      expect: {cursor: 2, preedit: "きょう", pending: ""}

# G-49: Backspace は直前のキー入力の取り消し。不一致で確定された文字は保留ローマ字に戻る
- name: composing-backspace-rollback-mismatch
  steps:
    - {key: "h"}
    - {key: "e"}
    - {key: "n"}
    - {key: "n"}
    - {key: "k"}
    - key: "p"
      expect: {preedit: "へんkp", pending: "p", segments: ["へん", "k"], kinds: ["japanese", "literal"]}
    - key: "BackSpace"
      expect: {preedit: "へんk", pending: "k", segments: ["へん"], kinds: ["japanese"]}
    - key: "a"
      expect: {preedit: "へんか", pending: "", segments: ["へんか"], kinds: ["japanese"]}

- name: composing-backspace-rollback-sokuon
  steps:
    - {key: "k"}
    - key: "k"
      expect: {preedit: "っk", pending: "k"}
    - key: "BackSpace"
      expect: {preedit: "k", pending: "k"}
    - key: "a"
      expect: {preedit: "か", pending: ""}

- name: composing-backspace-rollback-n-consonant
  steps:
    - {key: "n"}
    - key: "k"
      expect: {preedit: "んk", pending: "k"}
    - key: "BackSpace"
      expect: {preedit: "n", pending: "n"}
    - key: "a"
      expect: {preedit: "な", pending: ""}

# 履歴は直前の1キー分のみ。2回目の Backspace は従来どおり
- name: composing-backspace-rollback-only-last-key
  steps:
    - {key: "k"}
    - {key: "k"}
    - key: "BackSpace"
      expect: {preedit: "k", pending: "k"}
    - key: "BackSpace"
      expect: {preedit: "", state: direct}

# カーソル移動で履歴を破棄する
- name: composing-backspace-history-discarded-by-cursor-move
  steps:
    - {key: "h"}
    - {key: "e"}
    - {key: "n"}
    - {key: "n"}
    - {key: "k"}
    - {key: "p"}
    - {key: "Left"}
    - {key: "Right"}
    - key: "BackSpace"
      expect: {preedit: "へんk", pending: ""}

# ローマ字の引き継ぎ（H-23）: 不一致で素通しされた ky が、直後のかなを消すと保留に戻る
- name: composing-carryover-kypu-backspace-ou
  steps:
    - {key: "k"}
    - {key: "y"}
    - {key: "p"}
    - key: "u"
      expect: {preedit: "kyぷ", pending: ""}
    - key: "BackSpace"
      expect: {preedit: "ky", pending: "ky", state: composing}
    - {key: "o"}
    - key: "u"
      expect: {preedit: "きょう", pending: "", segments: ["きょう"]}

- name: composing-carryover-pending-deleted-one_by_one
  steps:
    - {key: "k"}
    - {key: "y"}
    - {key: "p"}
    - {key: "u"}
    - {key: "BackSpace"}
    - key: "BackSpace"
      expect: {preedit: "k", pending: "k"}
    - key: "BackSpace"
      expect: {preedit: "", pending: "", state: direct}

# 大文字（Shift 入力の Literal）は戻さない
- name: composing-carryover-skips-shift-literal
  steps:
    - {key: "Shift+k"}
    - {key: "y"}
    - {key: "k"}
    - {key: "a"}
    - key: "BackSpace"
      expect: {preedit: "Kyk", pending: ""}

# 戻した後に続きが無効なら従来どおり確定される
- name: composing-carryover-then-invalid-key
  steps:
    - {key: "k"}
    - {key: "y"}
    - {key: "p"}
    - {key: "u"}
    - {key: "BackSpace"}
    - key: "p"
      expect: {preedit: "kyp", pending: "p"}

# 設定オフでは従来どおり固定のまま
- name: composing-carryover-disabled
  config: {romaji_carryover: false}
  steps:
    - {key: "k"}
    - {key: "y"}
    - {key: "p"}
    - {key: "u"}
    - key: "BackSpace"
      expect: {preedit: "ky", pending: ""}
    - {key: "o"}
    - key: "u"
      expect: {preedit: "kyおう", pending: ""}
