- name: resize-right-extend-segment
  backend: mock
  mock:
    sentences:
      "きょうはいいてんき":
        - {reading: "きょう", candidates: ["今日"]}
        - {reading: "はいい", candidates: ["はいい"]}
        - {reading: "てんき", candidates: ["天気"]}
  steps:
    - key: "k"
      expect: {state: composing}
    - key: "y"
      expect: {state: composing}
    - key: "o"
      expect: {state: composing}
    - key: "u"
      expect: {state: composing}
    - key: "h"
      expect: {state: composing}
    - key: "a"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "t"
      expect: {state: composing}
    - key: "e"
      expect: {state: composing}
    - key: "n"
      expect: {state: composing}
    - key: "k"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting, focus: 0, segments: ["今日", "はいい", "天気"]}
    - key: "Shift+Right"
      expect: {state: converting, focus: 0, segments: ["きょうは", "いいてんき"]}

