- name: resize-hides-candidates
  backend: mock
  mock:
    sentences:
      "あいう":
        - {reading: "あい", candidates: ["あい"]}
        - {reading: "う", candidates: ["う"]}
      "あ":
        - {reading: "あ", candidates: ["あ"]}
      "いう":
        - {reading: "いう", candidates: ["いう"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "u"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting}
    - key: "Space"
      expect: {candidates_visible: true}
    - key: "Shift+Left"
      expect: {candidates_visible: false, state: converting}
