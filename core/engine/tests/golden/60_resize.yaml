        - {reading: "うえ", candidates: ["うえ"]}
        - {reading: "お", candidates: ["お"]}
      "あ":
        - {reading: "あ", candidates: ["あ"]}
      "いうえお":
        - {reading: "いうえお", candidates: ["いうえお"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "u"
      expect: {state: composing}
    - key: "e"
      expect: {state: composing}
    - key: "o"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting, focus: 0, segments: ["あい", "うえ", "お"]}
    - key: "Shift+Left"
      expect: {state: converting, segments: ["あ", "いうえお"]}

