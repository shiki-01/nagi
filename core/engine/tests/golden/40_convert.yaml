- name: convert-empty-input-no-convert
  steps:
    - key: "Space"
      expect: {state: direct, preedit: ""}

- name: convert-single-literal
  steps:
    - key: "3"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting, commit: null, preedit: "3"}

