- name: convert-literal-segments-pass-through
  backend: mock
  mock:
    sentences:
      "あ123う":
        - {reading: "あ", candidates: ["あ"]}
        - {reading: "う", candidates: ["う"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "1"
      expect: {state: composing, segments: ["あ", "1"], kinds: ["japanese", "literal"]}
    - key: "2"
      expect: {state: composing}
    - key: "3"
      expect: {state: composing}
    - key: "u"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting, segments: ["あ", "123", "う"], kinds: ["japanese", "literal", "japanese"]}

- name: convert-escape-back-to-composing
  backend: mock
  mock:
    sentences:
      "あ":
        - {reading: "あ", candidates: ["あ"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting}
    - key: "Escape"
      expect: {state: composing, preedit: "あ", readings: ["あ"], pending: ""}

