- name: convert-space-from-composing
  backend: mock
  mock:
    sentences:
      "きょうはいいてんき":
        - {reading: "きょうは", candidates: ["今日は", "京は", "きょうは"]}
        - {reading: "いいてんき", candidates: ["いい天気"]}
  steps:
    - key: "k"
      expect: {state: composing}
    - key: "y"
      expect: {state: composing}
    - key: "o"
      expect: {state: composing}
    - key: "u"
      expect: {state: composing}
    - key: "h"
      expect: {state: composing}
    - key: "a"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "t"
      expect: {state: composing}
    - key: "e"
      expect: {state: composing}
    - key: "n"
      expect: {state: composing}
    - key: "k"
      expect: {state: composing}
    - key: "i"
      expect: {preedit: "きょうはいいてんき", state: composing}
    - key: "Space"
      expect: {state: converting, focus: 0, candidates_visible: false, result_candidates_present: false}

- name: convert-f7-katakana
