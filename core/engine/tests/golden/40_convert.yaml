  mock:
    sentences:
      "こんにちは":
        - {reading: "こんにちは", candidates: ["こんにちは"]}
  steps:
    - key: "k"
      expect: {state: composing}
    - key: "o"
      expect: {state: composing}
    - key: "n"
      expect: {state: composing}
    - key: "n"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "t"
      expect: {state: composing}
    - key: "i"
      expect: {state: composing}
    - key: "h"
      expect: {state: composing}
