- name: cand-digit-select-page-1
  backend: mock
  config:
    page_size: 9
  mock:
    sentences:
      "あ":
        - {reading: "あ", candidates: ["c1", "c2", "c3", "c4", "c5", "c6"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting}
    - key: "Space"
      expect: {candidates_visible: true, selected: 1}
    - key: "3"
      expect: {candidates_visible: false}

- name: cand-digit-select-multi-page
  backend: mock
  config:
    page_size: 3
  mock:
    sentences:
      "あ":
        - {reading: "あ", candidates: ["c1", "c2", "c3", "c4", "c5", "c6"]}
  steps:
