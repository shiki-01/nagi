- name: cand-first-space-shows-window
  backend: mock
  mock:
    sentences:
      "あ":
        - {reading: "あ", candidates: ["愛", "亜", "あ"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting, candidates_visible: false, focus: 0}
    - key: "Space"
      expect: {state: converting, candidates_visible: true, selected: 1, candidates: ["愛", "亜", "あ", "ア"]}

