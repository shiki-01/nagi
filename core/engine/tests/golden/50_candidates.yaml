- name: cand-selected-updates-surface
  backend: mock
  mock:
    sentences:
      "あ":
        - {reading: "あ", candidates: ["愛", "亜"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting, segments: ["愛"]}
    - key: "Space"
