- name: cand-digit-without-window-restarts
  backend: mock
  mock:
    sentences:
      "あ":
        - {reading: "あ", candidates: ["愛"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting, candidates_visible: false}
    - key: "3"
      expect: {state: composing, commit: "愛", preedit: "3", pending: "", segments: ["3"]}

- name: cand-digit-0-inserts-zero
  backend: mock
  mock:
    sentences:
      "あ":
        - {reading: "あ", candidates: ["愛"]}
  steps:
    - key: "a"
      expect: {state: composing}
    - key: "Space"
      expect: {state: converting}
    - key: "Space"
      expect: {candidates_visible: true}
    - key: "0"
      expect: {commit: "あ", preedit: "0", pending: "", state: composing, segments: ["0"]}

- name: cand-literal-segment-no-candidates
  backend: mock
  mock:
    sentences:
      "a1b":
        - {reading: "a", candidates: ["A"]}
        - {reading: "b", candidates: ["B"]}
  steps:
    - key: "A"
      expect: {segments: ["A"], kinds: ["literal"]}
    - key: "1"
      expect: {segments: ["A1"], kinds: ["literal"]}
    - key: "b"
      expect: {segments: ["A1b"], kinds: ["literal"]}
    - key: "Space"
      expect: {state: converting, candidates_visible: false, focus: 0}

