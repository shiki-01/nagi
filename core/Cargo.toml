[workspace]
resolver = "3"
members = [
    "engine",
    "romaji",
    "dict",
    "infer",
    "protocol",
    "server",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shiki-01/nagi"
authors = ["shiki"]

[workspace.dependencies]
nagi-engine = { path = "engine" }
nagi-romaji = { path = "romaji" }
nagi-dict = { path = "dict" }
nagi-infer = { path = "infer" }
nagi-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
