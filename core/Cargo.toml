[workspace]
resolver = "3"
members = [
    "engine",
    "config",
    "learn",
    "profile",
    "romaji",
    "fuzzy",
    "dict",
    "infer",
    "protocol",
    "rewriter",
    "server",
    "ffi",
    "datafetch",
    "xtask",
    "../frontend-windows",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shiki-01/nagi"
authors = ["shiki"]

[workspace.dependencies]
nagi-engine = { path = "engine" }
nagi-romaji = { path = "romaji" }
nagi-fuzzy = { path = "fuzzy" }
nagi-dict = { path = "dict" }
nagi-datafetch = { path = "datafetch" }
nagi-infer = { path = "infer" }
nagi-config = { path = "config" }
nagi-learn = { path = "learn" }
nagi-profile = { path = "profile" }
nagi-protocol = { path = "protocol" }
nagi-rewriter = { path = "rewriter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# 辞書の構築・Viterbi は重いので、dev / test でも最適化する
[profile.dev.package.nagi-dict]
opt-level = 3
