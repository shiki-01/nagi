# Nagi デフォルト設定ファイル
# すべての項目を日本語コメント付きで記載
# 設計書 §6 参照

[profile]
# 環境プロファイルモード: "auto" / "quality" / "balanced" / "light" / "minimal"
# 既定: auto（実行環境に応じて自動判定）
mode = "auto"

# 環境の変化で自動的にプロファイルを切り替えるかどうか
# 既定: true
auto_switch = true

# ユーザーのペルソナ。スタイル変換等で使用される（v2 以降）
# 既定: ""（未指定）
persona = ""

[conversion]
# ライブ変換（Space キー不要のリアルタイム変換）を有効にするかどうか
# 既定: true
live_conversion = true

# ライブ変換の入力から実際に変換するまでの遅延（ミリ秒）。短いと変換頻度が増え負荷が上がる
# 既定: 228
live_conversion_delay_ms = 228

# ライブ変換を試みる最小文字数（読み）。これより短い入力では変換しない
# 1-20 の範囲で指定。設定画面（get_settings / update_settings）から編集できる
# 既定: 2
live_conversion_min_key_length = 2

# 変換の初期表示形式
# "sentence": 文全体の N-best を表示（既定）
# "segment": 先頭文節の候補を表示
initial_view = "sentence"

# ライブ変換時のチャンク長（文字数）
# 1-200 の範囲で指定。小さいほど反応が速いが CPU 負荷が増える
# 既定: 30
composing_chunk_len = 30

# LLM ビームサーチの幅（上位何案を保持するか）
# 1-16 の範囲。未指定の場合はプロファイルに従う
# 既定: 未指定（プロファイル自動判定）
# beam_width = 3

# 候補ウィンドウ 1 ページの候補数
# 1-50 の範囲で指定
# 既定: 9
num_candidates = 9

# LLM 推論スレッド数
# 0 = CPU コア数で自動判定、1 以上 = 指定値
# 0-8 の範囲で指定。変更は次回起動時に反映。設定画面から編集できる
# 既定: 0（自動）
n_threads = 0

# 使用する LLM モデル
# GGUF ファイルのパスまたはモデル ID を指定
# 未指定の場合はプロファイルに従う。変更は次回起動時に反映。設定画面から編集できる
# 既定: 未指定（プロファイル自動判定）
# model = "zenz-v3.1-small"

# LLM 推論を使うかどうか
# false = 辞書（Viterbi）のみで変換する（モデルを読み込んでいても使わない）
# 既定: true
use_llm = true

# 文脈を考慮するかどうか
# true = Surrounding Text を使用して文脈を推論に含める
# 既定: true
use_context = true

# 文脈の最大文字数（Unicode スカラー値）
# 1-200 の範囲。未指定の場合はプロファイルに従う。設定画面から編集できる
# 既定: 未指定（プロファイル自動判定）
# max_context_length = 100

# 推論の最大レイテンシ（ミリ秒）
# 10-10000 の範囲で指定。タイムアウト判定用。設定画面から編集できる（通常は変更不要）
# 既定: 100
max_latency_ms = 100

# 同期応答の最大予算（ミリ秒）
# 10-5000 の範囲で指定
# Space キー入力に対する応答待ち時間。超過するとひらがなのまま応答
# 既定: 150
sync_budget_ms = 150

[input]
# Shift + 英字の動作
# "literal_continue": 大文字を Literal で挿入し、後続も英字で続ける（既定）
#                    例: "Nagi" と入力できる
# "single_upper": 大文字 1 文字だけを Literal で挿入する
shift_letter = "literal_continue"

# 句読点の種類（全角記号）
# "、。" = 句点「。」読点「、」（既定）
# "，．" = 句点「．」読点「，」
# "，。" = 句点「。」読点「，」
punctuation = "、。"

# 濁点・半濁点・小書きキー（゛゜小）の循環順（タッチ入力のみ。物理キーボードには影響しない）
# "small_first": 小書きを先にする（既定）。つ→っ→づ、う→ぅ→ゔ（iOS 標準と同じ）
# "dakuten_first": 濁点を先にする。つ→づ→っ、う→ゔ→ぅ
# （か→が、は→ば→ぱ など、小書きのない文字はどちらでも同じ）
dakuten_cycle = "small_first"

# 消したローマ字の引き継ぎ（Backspace）
# true: 未変換のまま残ったローマ字を、有効な続きがある場合は入力中（保留）に戻す（既定）
#       例: "kypu" の "pu" を消すと "ky" が保留に戻り、続けて "ou" で「きょう」になる
# false: 残ったローマ字はそのまま確定した文字として残る
romaji_carryover = true

[input.auto_english]
# 英語の自動判定
# ローマ字のまま打った英単語（例: typescript）を、日本語入力を切り替えずに英語として入力できる
# ようにする。打鍵列をローマ字として読めるか（かなにならない英字がどれだけ残るか）と、英単語の
# 語彙（`cargo xtask fetch-english` で取得。無くても動くが精度は下がる）で判定する。
# 日本語として辞書で引ける読み（例: sense → せんせ）は日本語を優先する
# "off": 判定しない
# "conservative": 慎重（既定）。判定の自信が高いとき、Space で出る候補の上位（先頭の次）に
#                 英字を置く。それ以外は従来どおり候補の末尾付近。入力は自動では変わらない
# "standard": 標準（予約。先頭の候補を英字にする段階 2 用。現状は conservative と同じ動作）
# "aggressive": 積極的（予約。入力中に英字へ切り替える段階 3 用。現状は conservative と同じ動作）
mode = "conservative"

[input.fuzzy]
# 曖昧入力（タイプミスの補正候補）
# true: キー配置から考えられる打ち間違い（隣のキーの押し間違い・打ち忘れ・余計な打鍵・
#       隣り合う 2 文字の入れ替え・濁点や小書きの付け忘れ）を、辞書で変換できるものだけ
#       「もしかして」の候補として通常の候補の後ろに混ぜる。
#       入力中の読みは打った通りのままで、自動では置き換えない
# false: 補正候補を出さない（既定）
enabled = false

# 補正の強さ（許す打ち間違いの量）
# "gentle": 控えめ（1 操作まで程度）
# "normal": 標準（2 操作程度）（既定）
# "aggressive": 強め（3 操作程度。誤った候補も増える）
strength = "normal"

# 候補に混ぜる補正候補の最大数
# 1-5 の範囲。既定: 3
max_candidates = 3

# 補正する打ち間違いの種類（カンマ区切り）
# substitute: 隣のキーへの置き換え（かな入力では同じ行内の隣の文字）
# delete:     打ち忘れ（1 文字の補い）
# insert:     余計な打鍵（重複・隣のキーの触れ）の削除
# transpose:  隣り合う 2 文字の入れ替え
# voicing:    濁点・半濁点・小書きの付け忘れ / 付け過ぎ（かな入力）
# 既定: すべて
kinds = "substitute,delete,insert,transpose,voicing"

# タッチ座標を補正に使うか（タッチ入力のフロントが座標を送るときだけ効く）
# true: 押した位置が隣のキーとの境界に近いほど、隣のキーの押し間違いとして補正しやすくする。
#       フリックの角度が方向の境界に近いときも、隣の方向を候補にする（既定）
# false: 座標を使わず、キーの隣接関係だけで補正する
use_touch_coords = true

[ranking]
# 候補の優先順序（候補の出所）
# 設定された順序で候補を並べ替える
# 既知の出所: learned / user_dict / llm / system_dict / kana / rewriter / fuzzy
# （fuzzy = 曖昧入力の補正候補。省略すると最後に付く）
# 既定: 学習キャッシュ → ユーザー辞書 → LLM → システム辞書 → ひらがな → Rewriter
source_order = [
    "learned",
    "user_dict",
    "llm",
    "system_dict",
    "kana",
    "rewriter",
]

[learning]
# 学習を有効にするかどうか
# true = 確定候補を自動的に記録
# 既定: true
enabled = true

# 学習データの最大エントリ数
# 100-1000000 の範囲で指定
# 既定: 10000
max_entries = 10000

# 学習の強さ（確定した変換結果を候補の順位へ反映する度合い）
# 0.0-2.0 の範囲で指定。0 = 順位に反映しない、1.0 = 標準、2.0 = 強く反映
# 既定: 1.0
strength = 1.0

# 最後に使ってからこの日数が過ぎた学習を忘れる
# 0-3650 の範囲で指定。0 = 忘れない
# 既定: 0
forget_days = 0

# 学習を無効にするアプリのリスト
# パスワードマネージャ等、入力内容が機密のアプリを指定
# アプリ識別子（bundle id など）を含める
# 既定: パスワードマネージャの標準的な ID リスト
disabled_apps = [
    "com.1password.1password",
    "com.agilebits.onepassword7",
    "com.bitwarden.desktop",
    "org.keepassxc.keepassxc",
    "com.lastpass.LastPass",
]

[predict]
# 予測変換（未確定の読みから、学習キャッシュ・ユーザー辞書の前方一致で予測する）
# true = 有効、false = 無効
# 既定: true
enabled = true

# 予測変換を表示する最小の読みの文字数
# 1-20 の範囲で指定
# 既定: 1
min_chars = 1

# 確定直後の次語予測（入力中の読みが空のとき、学習した「直前の語 → 次の語」から候補を出す）
# 学習が無効・secure input 中・学習しないアプリでは、記録も表示もしない
# true = 有効、false = 無効
# 既定: false
next_word = false

# 次語予測の候補数
# 1-10 の範囲で指定
# 既定: 5
next_word_count = 5

[rewriter]
# 読みから絵文字の候補を出す（「わらう」→ 😄 など）。変換候補の後ろ（Rewriter の位置）に加わる
# ユーザー辞書の同じ読みの語・変換モデルの結果より前には出ない
# 既定: true
emoji = true

# 読みから顔文字の候補を出す（「えがお」→ (^_^) など）
# 既定: true
kaomoji = true

[convert]
# 電卓候補を出す（入力が「1+2」のような式のとき、計算結果「3」を Rewriter の候補に加える）
# 演算子は + - * / × ÷（全角も可）。括弧・複数項（優先順位つき）・末尾の `=` に対応。
# 割り切れない除算は有効桁 10 桁の小数。0 除算・桁あふれは候補を出さない
# 既定: true
calculator = true

# 入力中の候補（候補バーのサジェスト）の最大件数
# 読み全体の候補のあとに、読みの末尾を 1 文字ずつ削った接頭辞の候補（辞書のみ）が、1 文字の読みの
# 漢字まで続く。接頭辞の候補は、フロントが対応を宣言したとき（iOS の候補バー）だけ出る。
# 12〜500。既定: 120
suggest_max = 120

# 入力中の候補（候補バー）に出す記号（「かっこ」→「」『』、「まる」→ ○ など）の位置
#   "first"      : 候補の先頭
#   "after_best" : 最良の変換の直後（既定）
#   "last"       : 候補の末尾
#   "off"        : 入力中の候補には出さない
# 「みぎ」「うえ」「ほし」のように普通の語でもある読みで、記号が 2 番目に出るのが煩わしいときは
# "last" か "off" にする。Space で開く候補一覧の記号（Rewriter）は、この設定に関わらず出る
# 既定: "after_best"
symbol_position = "after_best"

[convert.loanword]
# カタカナ語の原語を変換候補に出す（コンピューター → computer、アルバイト → Arbeit）
# 原語は JMdict の外来語データにある言語・綴りのまま（英語は英語、ドイツ語はドイツ語）。
# 和製英語（サラリーマンなど）は出さず、複合語は初期は出さない。読みの揺れ（コンピュータ、ヴァイオリン、
# ウィンドウ/ウインドウなど）は同じ語として引き、辞書に載っていない綴りは近い語を低い順位で出す
# 候補は記号などの Rewriter と同じ位置（形式の変換より前）。最大 3 件
# データ（data/loanword/loanword.fst）は「辞書とモデルをダウンロード…」または
# imserver --install-data で入る。無ければ出ない
# 既定: true
enabled = true

[apps]
# アプリの種類ごとの既定モードと、記号で始まる語の素通し
# アプリは、フロントが伝えるアプリ識別子（macOS: bundle id、Windows: 実行ファイル名）で
# code（コードエディタ・ターミナル）/ chat / general（それ以外）に分ける。分類表は同梱しており、
# [apps.classes] で追加・上書きできる

# フォーカスを得たときの入力モード（種類ごと）
# keep = 変えない（前回のまま）、hiragana = ひらがな、alphanumeric = 英数
# 既定: code は alphanumeric、chat と general は keep
code_mode = "alphanumeric"
chat_mode = "keep"
general_mode = "keep"

# 手で切り替えた入力モードをアプリごとに覚え、次にそのアプリに入ったとき最優先で使う
# 覚えた内容は再起動で消える
# 既定: true
remember_mode = true

# 素通し: 何も入力していない状態で下の記号を打ったとき、その語（スペースまで）は
# 日本語に変換せず ASCII のまま入力する（/help、@name、$HOME、:wq など）。
# スペースで語を確定し、スペース自体はアプリに渡る
# 既定: true
passthrough = true

# 素通しの先頭記号（ASCII の記号を並べる）
# 既定: "/$@!:#"
passthrough_chars = "/$@!:#"

# 利用者の分類表（パターン = 種類）。同梱の表より優先する。
# パターンは完全一致。末尾が * なら前方一致（例: com.jetbrains.*）。大文字小文字は区別しない
# 同梱の表の例: com.apple.Terminal, com.googlecode.iterm2, com.microsoft.VSCode,
#   com.jetbrains.*, com.apple.dt.Xcode, WindowsTerminal.exe, Code.exe など（code）
# [apps.classes]
# "com.example.MyEditor" = "code"
# "com.example.*" = "chat"

[userdict]
# ユーザー辞書の語を変換・予測に使うかどうか
# false にしても登録内容は消えない（スニペットは [snippet] で別に切り替える）
# 既定: true
enabled = true

[snippet]
# スニペット（短い読みで定型文）を候補に出すかどうか
# false にしても登録内容は消えない
# 既定: true
enabled = true

[keymap]
# キーマップのプリセット
# "default" = 標準的な日本語入力キー配置（既定）
preset = "default"

# ローマ字入力中（Composing）のキー上書き。キー仕様文字列 → Action 名
# キー仕様: "Ctrl+j" のような "修飾+キー名" 形式（修飾: Ctrl/Shift/Alt/Meta、順不同）
# Action 名: StartConvert / NextCand / PrevCand / Commit / Cancel / Backspace /
#   DeleteForward / MoveCursor:Left / MoveCursor:Right / MoveCursorHome / MoveCursorEnd /
#   ToKatakana / ToHiragana / ToggleMode / NoOp / SuggestNext / SuggestPrev
# SuggestNext / SuggestPrev は入力中のサジェスト（候補）の選択を進める / 戻す（末尾の次は先頭、
# 先頭の前は未選択）。既定ではサジェスト表示中だけ ↓ / Tab = SuggestNext、↑ = SuggestPrev になる
# （選択中の Enter でその候補を確定、Esc で選択解除、Space で変換）。上書きしたキーはその割当が優先
# 既定: 空（上書きなし）
# [keymap.composing]
# "Ctrl+j" = "ToKatakana"

# 変換中（Converting）のキー上書き。上記に加えて MoveFocus:Left/Right、
# ResizeSegment:Left/Right、ExtendSelection:Left/Right、SelectCand:1〜9、DeleteLearning が使える
# 既定: 空（上書きなし）
# [keymap.converting]
# "Tab" = "NextCand"

[update]
# アップデートの自動確認
# true = 起動時に新バージョンを確認（ダウンロード・インストールは行わず、通知のみ）
# false = 確認しない
# 既定: true
auto_check = true

# アップデート確認マニフェストの URL（省略時は OS ごとの既定の URL を使う）
# 既定: 未指定
# check_url = "https://nagi.shiki-01.com/updates/macos/latest.json"
