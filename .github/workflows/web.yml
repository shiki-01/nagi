name: web

on:
  push:
    paths: ['web/**', 'config/keyboard/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'config/keyboard/**', '.github/workflows/web.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # macOS のアップデート確認先（/updates/macos/latest.json）は、最新の macos-v* リリースの latest.json を
      # 取り込んで公開する（macos-release ワークフローが作る。リリースが無ければ飛ばす）
      - name: macOS の latest.json を取り込む
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select((.tagName | startswith("macos-v")) and (.isDraft | not) and (.isPrerelease | not))][0].tagName // empty')
          if [ -n "$tag" ]; then
            mkdir -p static/updates/macos
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir static/updates/macos --clobber
            echo "取り込んだリリース: $tag"
          else
            echo "macos-v* のリリースが無いため飛ばしました"
          fi
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build

  # Cloudflare Pages へ公開する。手動実行（workflow_dispatch。macos-release からの起動を含む）で main のときだけ動く。
  # main への push では公開しない（未完成の install.sh 等が意図せず公開されないように。push では check だけ走る）。
  # 必要な Secrets: CLOUDFLARE_API_TOKEN（Account > Cloudflare Pages > Edit）/ CLOUDFLARE_ACCOUNT_ID
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: nagi
      PAGES_DOMAIN: nagi.shiki-01.com
    steps:
      - name: Secrets の確認（未設定ならデプロイだけ飛ばす）
        id: sec
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、デプロイを飛ばしました（Settings > Secrets and variables > Actions）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.sec.outputs.ok == 'true'
        with:
          name: web-build
          path: web/build
      - uses: actions/setup-node@v4
        if: steps.sec.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Pages プロジェクトを用意する（無ければ作成）
        if: steps.sec.outputs.ok == 'true'
        run: |
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main \
            || echo "プロジェクトは作成済みとみなして続行します"
      - name: デプロイ
        if: steps.sec.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy web/build --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
      - name: カスタムドメインを追加する（追加済みなら何もしない）
        if: steps.sec.outputs.ok == 'true'
        run: |
          code=$(curl -sS -o /tmp/domain.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"name\":\"$PAGES_DOMAIN\"}")
          echo "HTTP $code"; cat /tmp/domain.json; echo
          if [ "$code" != "200" ] && ! grep -q 'already' /tmp/domain.json; then
            echo "::warning::カスタムドメインの追加に失敗しました。Cloudflare ダッシュボードの Pages > nagi > Custom domains で追加してください"
          fi
