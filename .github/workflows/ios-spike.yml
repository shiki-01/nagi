name: ios-spike

# iOS 実機検証アプリ（frontend-ios-spike）のビルド。未署名 IPA を artifact として出力する。
# 署名は SideStore 等で端末側に任せる想定。

on:
  # 当面は手動実行のみ（自動実行は停止中）
  workflow_dispatch:
    inputs:
      llama:
        description: "LLM 推論（llama.cpp）を有効にしてビルドする"
        type: boolean
        default: false
      codesign_adhoc:
        description: "ldid ではなく codesign（アドホック署名）でエンタイトルメントを埋め込む（キーボード拡張の Invalid Page 切り分け用の実験）"
        type: boolean
        default: false

concurrency:
  group: ios-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Rust ツールチェーン（core/rust-toolchain.toml に従う）
        working-directory: core
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: XcodeGen と cmake を用意
        run: brew install xcodegen cmake ldid

      - name: XCFramework をビルド
        working-directory: core
        run: |
          if [ "${{ inputs.llama }}" = "true" ]; then
            cargo xtask build-ios-xcframework --llama
          else
            cargo xtask build-ios-xcframework
          fi

      - name: 辞書を取得・生成（アプリのリソースに含める）
        working-directory: core
        run: |
          cargo xtask fetch-dict
          cargo xtask build-dict

      - name: 辞書をアプリのリソースへ配置
        run: |
          mkdir -p frontend-ios-spike/Resources/data/dict
          cp data/dict/nagi-dict.bin frontend-ios-spike/Resources/data/dict/

      - name: Xcode プロジェクトを生成
        working-directory: frontend-ios-spike
        run: |
          if [ "${{ inputs.llama }}" = "true" ]; then
            NAGI_LLM=NAGI_LLM xcodegen generate
          else
            NAGI_LLM=NAGI_NO_LLM xcodegen generate
          fi

      - name: アーカイブ（未署名）
        working-directory: frontend-ios-spike
        run: |
          mkdir -p build
          xcodebuild archive \
            -project NagiSpike.xcodeproj \
            -scheme NagiSpike \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/NagiSpike.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | tail -n 40
        shell: bash

      # 診断（キーボード拡張が CODESIGNING Invalid Page で起動直後に kill される件の切り分け用）。
      # ldid の前後でアプリと拡張の署名・Mach-O 構造・ハッシュを比べる。失敗してもジョブは止めない。
      - name: 署名診断（ldid 前）
        working-directory: frontend-ios-spike
        run: |
          bash ../.github/scripts/ios-signing-diag.sh before-ldid \
            build/NagiSpike.xcarchive/Products/Applications/NagiSpike.app \
            build/diag/signing-before-ldid.log
        continue-on-error: true

      # CODE_SIGNING_ALLOWED=NO ではエンタイトルメントがバイナリに入らず、SideStore が
      # App Group を付与できない。ldid の擬似署名で埋め込む（実署名は SideStore が行う）。
      - name: エンタイトルメントを埋め込む（ldid）
        if: ${{ !inputs.codesign_adhoc }}
        working-directory: frontend-ios-spike
        run: |
          APP=build/NagiSpike.xcarchive/Products/Applications/NagiSpike.app
          ldid -SApp/NagiSpike.entitlements "$APP/NagiSpike"
          for appex in "$APP"/PlugIns/*.appex; do
            name=$(basename "$appex" .appex)
            ldid -SKeyboard/NagiSpikeKeyboard.entitlements "$appex/$name"
          done
          # 埋め込み結果の検証（application-groups が無ければ失敗させる）
          for bin in "$APP/NagiSpike" "$APP"/PlugIns/*.appex/NagiSpikeKeyboard; do
            ldid -e "$bin" | tee /dev/stderr | grep -q '<key>com.apple.security.application-groups</key>'
          done

      # 実験: ldid の擬似署名ではなく、Apple の codesign でアドホック署名する。
      # 拡張 → アプリの順（内側から）に署名し、CI 上で codesign --verify で検証できる状態にする。
      # SideStore が再署名する前提なので、アドホック署名（証明書なし）で足りる。
      - name: エンタイトルメントを埋め込む（codesign アドホック）
        if: ${{ inputs.codesign_adhoc }}
        working-directory: frontend-ios-spike
        run: |
          set -euo pipefail
          APP=build/NagiSpike.xcarchive/Products/Applications/NagiSpike.app
          for appex in "$APP"/PlugIns/*.appex; do
            codesign --force --sign - \
              --entitlements Keyboard/NagiSpikeKeyboard.entitlements \
              --timestamp=none "$appex"
          done
          codesign --force --sign - \
            --entitlements App/NagiSpike.entitlements \
            --timestamp=none "$APP"
          # 検証: 署名が有効であること、application-groups が入っていること
          codesign --verify --deep --strict --verbose=2 "$APP"
          for target in "$APP" "$APP"/PlugIns/*.appex; do
            echo "=== $target"
            ents=$(codesign -d --entitlements :- "$target" 2>&1)
            echo "$ents"
            echo "$ents" | grep -q 'com.apple.security.application-groups'
          done

      - name: 署名診断（署名後）
        working-directory: frontend-ios-spike
        run: |
          bash ../.github/scripts/ios-signing-diag.sh after-sign \
            build/NagiSpike.xcarchive/Products/Applications/NagiSpike.app \
            build/diag/signing-after-sign.log
        continue-on-error: true

      - name: IPA を作成
        working-directory: frontend-ios-spike
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/NagiSpike.xcarchive/Products/Applications/NagiSpike.app build/ipa/Payload/
          (cd build/ipa && zip -qr ../NagiSpike-unsigned.ipa Payload)
          ls -lh build/NagiSpike-unsigned.ipa

      # IPA を展開し直して、ldid 後と実行ファイルが一致するか（zip で壊れていないか）を確認する。
      # 配布した IPA を SideStore が再署名する前の状態の記録にもなる。
      - name: 署名診断（IPA 展開後）
        working-directory: frontend-ios-spike
        run: |
          d=$(mktemp -d)
          unzip -q build/NagiSpike-unsigned.ipa -d "$d"
          bash ../.github/scripts/ios-signing-diag.sh from-ipa \
            "$(echo "$d"/Payload/*.app)" \
            build/diag/signing-from-ipa.log
          echo "=== 実行ファイルのハッシュ比較（ldid 後の archive と IPA 展開後）"
          src=build/NagiSpike.xcarchive/Products/Applications/NagiSpike.app
          for rel in NagiSpike PlugIns/NagiSpikeKeyboard.appex/NagiSpikeKeyboard; do
            a=$(shasum -a 256 "$src/$rel" | cut -d' ' -f1)
            b=$(shasum -a 256 "$(echo "$d"/Payload/*.app)/$rel" | cut -d' ' -f1)
            [ "$a" = "$b" ] && r=一致 || r=不一致
            echo "$rel: archive=$a ipa=$b $r"
          done | tee build/diag/hash-compare.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: NagiSpike-unsigned-ipa
          path: frontend-ios-spike/build/NagiSpike-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signing-diag
          path: frontend-ios-spike/build/diag
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: frontend-ios-spike/build/xcodebuild.log
          if-no-files-found: ignore
