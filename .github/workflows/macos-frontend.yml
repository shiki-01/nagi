name: macOS frontend

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "frontend-macos/**"
      - "core/protocol/**"
      - "core/xtask/**"
      - "core/server/**"
      - ".github/workflows/macos-frontend.yml"
  pull_request:
    paths:
      - "frontend-macos/**"
      - "core/protocol/**"
      - "core/xtask/**"
      - "core/server/**"
      - ".github/workflows/macos-frontend.yml"

jobs:
  swift:
    name: swift build & test (macos)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend-macos
    steps:
      - uses: actions/checkout@v4
      - name: swift version
        run: swift --version
      - name: build
        run: swift build
      - name: test
        run: swift test
      - name: Install Rust (rust-toolchain.toml)
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: bundle (Nagi.app, ad-hoc signed)
        working-directory: core
        run: cargo xtask bundle-macos
      - uses: actions/upload-artifact@v4
        with:
          name: Nagi.app
          path: core/target/macos-bundle/Nagi.app.zip
          if-no-files-found: error
