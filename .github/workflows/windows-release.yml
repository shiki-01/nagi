name: windows-release

# Windows 版（TSF の DLL + imserver.exe、LLM 有効）を MSVC でビルドし、zip にまとめて GitHub Releases に公開する。
# あわせて ed25519 署名つきの latest.json を作り、サイト（nagi.shiki-01.com/updates/windows/latest.json）に載せる
# ため web ワークフローを起動する（web が最新の windows-v* リリースから latest.json を取り込む）。
# 方針は docs/decisions.md H-42。
#
# 署名なし配布が前提（Authenticode 証明書は未取得。SmartScreen の扱いは docs/windows-install.md）。
# 証明書があれば、次の Secrets を登録すると signtool で DLL と exe に署名する（無ければ署名なしで続行）:
#   WINDOWS_CODESIGN_PFX           コード署名証明書（秘密鍵つき）の .pfx を base64 にしたもの
#   WINDOWS_CODESIGN_PFX_PASSWORD  上の .pfx のパスワード
# 必須の Secrets:
#   NAGI_UPDATE_SIGNING_KEY        アップデート署名用 ed25519 秘密鍵（`cargo xtask gen-update-key` の出力。macOS と共通）
#
# リリース手順:
#   1. core/Cargo.toml の [workspace.package] version を上げて main にコミットする
#   2. gh workflow run windows-release.yml --ref main -f version=X.Y.Z
#      （version が core/Cargo.toml と一致しなければ失敗する。タグ windows-vX.Y.Z はこのワークフローが作る）
#   実機で未検証の間は prerelease（既定）にしておく。prerelease は web ワークフローの latest.json の取り込み対象外なので、
#   サイトの更新確認・インストールコマンドには出ない。実機で確認できたら -f prerelease=false で公開する。
#   公開せずビルドだけ試すときは -f publish=false（成果物は Actions の artifact に残る）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（X.Y.Z。core/Cargo.toml の version と一致させる）"
        required: true
      llama:
        description: "imserver を LLM（llama.cpp）有効でビルドする"
        type: boolean
        default: true
      publish:
        description: "GitHub Releases に公開する（false なら artifact だけ）"
        type: boolean
        default: true
      prerelease:
        description: "prerelease として公開する（実機で未検証の間は true）"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: バージョンの確認
        working-directory: core
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version は X.Y.Z 形式で指定してください: $VERSION"; exit 1; }
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xtask") | .version' | tr -d '\r')
          if [ "$crate_version" != "$VERSION" ]; then
            echo "::error::入力の version ($VERSION) と core/Cargo.toml の version ($crate_version) が一致しません"
            exit 1
          fi
          if gh release view "windows-v$VERSION" >/dev/null 2>&1; then
            echo "::error::リリース windows-v$VERSION は作成済みです"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Secrets の確認
        env:
          SIGNING_KEY: ${{ secrets.NAGI_UPDATE_SIGNING_KEY }}
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::Secrets が未設定です: NAGI_UPDATE_SIGNING_KEY"; exit 1; }
          if [ -z "$PFX" ]; then
            echo "::notice::WINDOWS_CODESIGN_PFX が未設定のため、Authenticode 署名なしでビルドします（SmartScreen の警告が出る配布物になります）"
          fi

      - name: Install Rust (rust-toolchain.toml)
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: windows-release-${{ inputs.llama }}

      - name: libclang の場所（llama のとき。windows-latest は LLVM が入っている）
        if: inputs.llama
        run: |
          for d in "/c/Program Files/LLVM/bin" "/c/Program Files (x86)/LLVM/bin"; do
            if [ -e "$d/libclang.dll" ]; then
              echo "LIBCLANG_PATH=$(cygpath -w "$d")" >> "$GITHUB_ENV"
              found=1
              break
            fi
          done
          [ -n "$found" ] || { echo "::error::libclang.dll が見つかりません"; exit 1; }

      # DLL はあらゆるホストプロセスに読み込まれるため、Visual C++ ランタイムに依存しないよう CRT を静的リンクする。
      # --target を明示すると RUSTFLAGS はビルドスクリプト・proc-macro（ホスト側）には掛からない。
      - name: TSF の DLL をビルド（CRT 静的リンク）
        working-directory: core
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target "$TARGET" -p nagi-windows-tsf

      # imserver は llama.cpp（C++）を含むため CRT は既定（動的）のまま。Visual C++ 再頒布可能パッケージを前提にする
      # （install.ps1 が確認して警告を出す）。静的リンクは llama-cpp-sys-2 の LLAMA_STATIC_CRT で可能だが未検証。
      - name: imserver をビルド
        working-directory: core
        run: |
          features=()
          if [ "${{ inputs.llama }}" = "true" ]; then features=(--features llama); fi
          cargo build --release --target "$TARGET" -p nagi-server --bin imserver "${features[@]}"

      - name: Authenticode 署名の準備（証明書があるときだけ）
        id: codesign
        env:
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
        run: |
          if [ -z "$PFX" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PFX" | base64 --decode > "$RUNNER_TEMP/codesign.pfx"
          signtool=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -n 1)
          [ -n "$signtool" ] || { echo "::error::signtool.exe が見つかりません"; exit 1; }
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "signtool=$(cygpath -w "$signtool")" >> "$GITHUB_OUTPUT"
          echo "pfx=$(cygpath -w "$RUNNER_TEMP/codesign.pfx")" >> "$GITHUB_OUTPUT"

      - name: bundle（収集・署名・チェックサム・zip）
        working-directory: core
        env:
          NAGI_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          sign=()
          if [ "${{ steps.codesign.outputs.enabled }}" = "true" ]; then
            sign=(--sign-pfx "${{ steps.codesign.outputs.pfx }}" --signtool "${{ steps.codesign.outputs.signtool }}")
          fi
          cargo xtask bundle-windows --target "$TARGET" "${sign[@]}"
          cp "target/windows-bundle/Nagi-windows-$VERSION.zip" "../Nagi-windows-$VERSION.zip"

      # install.ps1 / uninstall.ps1 の実行確認（regsvr32 の登録と解除を含む）。ランナーでの TSF 登録が
      # 通るかは未確認のため、失敗しても警告に留める（実機の検証項目: docs/real-hardware-checklist.md §8.7）
      - name: インストーラのスモークテスト（失敗は警告）
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'smoke'
          Expand-Archive -LiteralPath "Nagi-windows-$env:VERSION.zip" -DestinationPath $root
          $dir = Join-Path $root "Nagi-windows-$env:VERSION"
          $dest = Join-Path $env:RUNNER_TEMP 'NagiInstalled'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'install.ps1') -SkipData -InstallDir $dest
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 が失敗しました ($LASTEXITCODE)" }
          if (-not (Test-Path (Join-Path $dest 'nagi_windows_tsf.dll'))) { throw 'DLL が配置されていません' }
          if (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Nagi')) { throw '「アプリと機能」の項目がありません' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dest 'uninstall.ps1') -InstallDir $dest
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 が失敗しました ($LASTEXITCODE)" }
          Write-Host 'スモークテスト OK'

      - name: latest.json（ed25519 署名つき）
        working-directory: core
        env:
          NAGI_UPDATE_SIGNING_KEY: ${{ secrets.NAGI_UPDATE_SIGNING_KEY }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          cargo xtask sign-update \
            --file "../Nagi-windows-$VERSION.zip" \
            --version "$VERSION" \
            --download-url "$base/download/windows-v$VERSION/Nagi-windows-$VERSION.zip" \
            --notes-url "$base/tag/windows-v$VERSION" \
            --out ../latest.json
          cat ../latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: nagi-windows-${{ inputs.version }}
          path: |
            Nagi-windows-${{ inputs.version }}.zip
            latest.json

      - name: GitHub Releases に公開
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags=(--prerelease); fi
          gh release create "windows-v$VERSION" "Nagi-windows-$VERSION.zip" latest.json \
            --target "$GITHUB_SHA" \
            --title "Nagi for Windows $VERSION" \
            "${flags[@]}" \
            --notes "Windows 10 22H2 以降 / 11（x64）。Authenticode 署名なし（SmartScreen の警告が出ることがあります。手順: docs/windows-install.md）。インストール: PowerShell で \`irm https://nagi.shiki-01.com/install.ps1 | iex\`（辞書とモデルも配布元から自動で取得する）。実機で未検証の版は prerelease。"

      - name: サイトの latest.json を更新（web ワークフローを起動）
        if: inputs.publish && !inputs.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web.yml --ref main

      - name: 後片付け
        if: always()
        run: rm -f "$RUNNER_TEMP/codesign.pfx"
