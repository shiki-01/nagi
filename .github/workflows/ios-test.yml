name: ios-test

# frontend-ios-spike の Swift 単体テスト（NagiSpikeTests）。
# Rust / XCFramework のビルドは不要: テストターゲットは純粋な Swift（Shared/KeyboardLayout.swift など）と
# 生成型（frontend-macos/Sources/Generated/Protocol.swift）をバンドルへ直接コンパイルし、
# 同梱レイアウト（config/keyboard/presets/*.json）をリソースとして読む。署名も不要（iOS Simulator）。

on:
  push:
    paths:
      - "frontend-ios-spike/**"
      - "config/keyboard/**"
      - "frontend-macos/Sources/Generated/**"
      - ".github/workflows/ios-test.yml"
  pull_request:
    paths:
      - "frontend-ios-spike/**"
      - "config/keyboard/**"
      - "frontend-macos/Sources/Generated/**"
      - ".github/workflows/ios-test.yml"
  workflow_dispatch:

concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen を用意
        run: brew install xcodegen

      # メインターゲットは NagiCore.xcframework（Rust のビルド成果物）を参照する。テストスキームは
      # それらをビルドしないが、プロジェクト生成時に参照先が無くて失敗しないよう空のディレクトリを置く
      - name: Xcode プロジェクトを生成
        working-directory: frontend-ios-spike
        run: |
          mkdir -p NagiCore.xcframework
          NAGI_LLM=NAGI_NO_LLM xcodegen generate

      - name: 最新の iPhone シミュレータを選ぶ
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  if not d["name"].startswith("iPhone") or not d.get("isAvailable", True):
                      continue
                  # 新しい runtime を優先し、同じなら "Pro"（Max / Plus 以外）の端末を優先
                  rank = (version, d["name"].endswith("Pro"), d["name"])
                  if best is None or rank > best[0]:
                      best = (rank, d["udid"], d["name"], runtime)
          if best is None:
              sys.exit("利用できる iPhone シミュレータがありません")
          print(f"SIM_UDID={best[1]}")
          print(f"SIM_NAME={best[2]} ({best[3]})", file=sys.stderr)
          PY

      - name: テスト（iOS Simulator）
        working-directory: frontend-ios-spike
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project NagiSpike.xcodeproj \
            -scheme NagiSpikeTests \
            -destination "id=$SIM_UDID" \
            -resultBundlePath build/NagiSpikeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-test.log | tail -n 80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            frontend-ios-spike/build/xcodebuild-test.log
            frontend-ios-spike/build/NagiSpikeTests.xcresult
          if-no-files-found: ignore
