name: CI

on:
  # 当面は手動実行のみ（push / pull_request での自動実行は停止中）
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace

  # Windows フロント（Phase 5、H-39）。`nagi-windows` / `nagi-windows-tsf` は workspace members なので、
  # 上の `core` ジョブ（ubuntu / windows / macos の fmt・clippy・build・test）で 3 OS とも検査される。
  # ここでは Linux 上で Windows ターゲットの型検査と lint を回す（リンクはしない。COM / TSF 部分は
  # Windows 以外では cfg で除外されるため、通常のジョブでは検査されない）
  windows-tsf:
    name: windows tsf (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add target
        run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo check
        run: cargo check -p nagi-windows -p nagi-windows-tsf --target x86_64-pc-windows-gnu --all-targets
      - name: clippy
        run: cargo clippy -p nagi-windows -p nagi-windows-tsf --target x86_64-pc-windows-gnu --all-targets -- -D warnings

  # Windows の配布スクリプト（H-42）の構文検査。PowerShell の構文エラーは実行するまで分からないため
  windows-scripts:
    name: windows scripts (PowerShell syntax)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell の構文を検査
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in 'frontend-windows/dist/install.ps1', 'frontend-windows/dist/uninstall.ps1', 'web/static/install.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors.Count) { $bad++; $errors | ForEach-Object { Write-Host "${f}:$($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Host "OK $f" }
          }
          exit $bad

  types:
    name: protocol types (typeshare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # cargo install は毎回 crates.io から最新版をビルドし直すため遅い（数分）。
      # バイナリをキャッシュし、無ければインストールする。キーを変えれば強制的に入れ直せる
      - name: Cache typeshare-cli
        id: cache-typeshare
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-cli-${{ runner.os }}-v1
      - name: Install typeshare-cli
        if: steps.cache-typeshare.outputs.cache-hit != 'true'
        run: cargo install typeshare-cli --locked
      - name: Regenerate Swift types and check diff
        run: cargo xtask check-types

  # D-3: モバイル向けクロスビルド（コアがモバイルでビルドできる依存に収まっていること。llama 無し）
  mobile:
    name: mobile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo check
        run: >
          cargo check --target ${{ matrix.target }}
          -p nagi-ffi -p nagi-engine -p nagi-romaji -p nagi-dict -p nagi-protocol
          -p nagi-profile -p nagi-learn -p nagi-config -p nagi-rewriter
