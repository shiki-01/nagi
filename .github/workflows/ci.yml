name: CI

on:
  # 当面は手動実行のみ（push / pull_request での自動実行は停止中）
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace

  types:
    name: protocol types (typeshare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # cargo install は毎回 crates.io から最新版をビルドし直すため遅い（数分）。
      # バイナリをキャッシュし、無ければインストールする。キーを変えれば強制的に入れ直せる
      - name: Cache typeshare-cli
        id: cache-typeshare
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-cli-${{ runner.os }}-v1
      - name: Install typeshare-cli
        if: steps.cache-typeshare.outputs.cache-hit != 'true'
        run: cargo install typeshare-cli --locked
      - name: Regenerate Swift types and check diff
        run: cargo xtask check-types

  # モバイル向けクロスビルドの確認（docs/mobile-design.md §3 の制約を守れているかの検査）。
  # check のみで、C/C++ 依存（llama 等）は含めない。NDK / Xcode は不要
  mobile:
    name: mobile check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}
      # nagi-infer は feature llama 無し（既定）。dict は D-1（memmap2 導入）の影響を受ける
      - name: check
        run: >-
          cargo check --target ${{ matrix.target }}
          -p nagi-engine -p nagi-romaji -p nagi-dict
          -p nagi-protocol -p nagi-profile -p nagi-infer
      # profile は sysinfo 無し（OS 問い合わせをホスト注入に置き換える構成）でも通ること
      - name: check (profile without sysinfo)
        run: cargo check --target ${{ matrix.target }} -p nagi-profile --no-default-features
      # ffi は sysinfo / update-check 無し（モバイル構成。ring 等の C 依存を含まない）でも通ること
      - name: check (ffi without default features)
        run: cargo check --target ${{ matrix.target }} -p nagi-ffi --no-default-features
