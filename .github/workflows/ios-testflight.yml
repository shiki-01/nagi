name: ios-testflight

# iOS アプリ（frontend-ios-spike）を署名して TestFlight（App Store Connect）へアップロードする。
# 署名は App Store Connect API キーによるクラウド署名（-allowProvisioningUpdates）。
# 証明書・プロビジョニングプロファイルはリポジトリにも Secrets にも置かない。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   APPLE_TEAM_ID   Apple Developer の Team ID（10 文字）
#   ASC_KEY_ID      App Store Connect API キーの Key ID
#   ASC_ISSUER_ID   同 Issuer ID
#   ASC_KEY_P8      AuthKey_XXXX.p8 の中身（-----BEGIN PRIVATE KEY----- から全文）
#
# 事前に Developer ポータルで App ID（com.shiki01.nagi / com.shiki01.nagi.keyboard）と
# App Group（group.com.shiki01.nagi）を登録し、App Store Connect でアプリを作成しておくこと。

# 表示バージョン（CFBundleShortVersionString）の決まり方:
#   1. タグ ios-vX.Y.Z の push で起動した場合は、そのタグの X.Y.Z
#   2. 手動実行で marketing_version を入力した場合は、その値
#   3. 手動実行で空欄の場合は、最新の ios-v* タグの X.Y.Z（タグが無ければ 1.0.0）
# ビルド番号（CFBundleVersion）は github.run_number で常に自動採番する。
# リリース手順: git tag ios-v0.2.0 && git push origin ios-v0.2.0

on:
  push:
    tags:
      - "ios-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "表示バージョン（空欄なら最新の ios-v* タグ、無ければ 1.0.0）"
        type: string
        default: ""
      llama:
        description: "LLM 推論（llama.cpp）を有効にしてビルドする"
        type: boolean
        default: false

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ios-v* タグを参照するため

      - name: 表示バージョンを決定
        env:
          INPUT_VERSION: ${{ inputs.marketing_version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#ios-v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            v="${INPUT_VERSION}"
          else
            latest=$(git tag --list 'ios-v*' --sort=-v:refname | head -n 1)
            v="${latest#ios-v}"
            v="${v:-1.0.0}"
          fi
          echo "MARKETING_VERSION=${v}" >> "$GITHUB_ENV"
          echo "表示バージョン: ${v} / ビルド番号: ${{ github.run_number }}"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Rust ツールチェーン（core/rust-toolchain.toml に従う）
        working-directory: core
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: XcodeGen と cmake を用意
        run: brew install xcodegen cmake

      - name: XCFramework をビルド
        working-directory: core
        run: |
          if [ "${{ inputs.llama }}" = "true" ]; then
            cargo xtask build-ios-xcframework --llama
          else
            cargo xtask build-ios-xcframework
          fi

      - name: 辞書を取得・生成（アプリのリソースに含める）
        working-directory: core
        run: |
          cargo xtask fetch-dict
          cargo xtask build-dict

      - name: 辞書をアプリのリソースへ配置
        run: |
          mkdir -p frontend-ios-spike/Resources/data/dict
          cp data/dict/nagi-dict.bin frontend-ios-spike/Resources/data/dict/

      - name: Xcode プロジェクトを生成
        working-directory: frontend-ios-spike
        run: |
          if [ "${{ inputs.llama }}" = "true" ]; then
            NAGI_LLM=NAGI_LLM xcodegen generate
          else
            NAGI_LLM=NAGI_NO_LLM xcodegen generate
          fi

      - name: App Store Connect API キーを配置
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      # CI の Mac は毎回まっさらで、署名の自動管理が開発証明書を毎回新しく作る。残ると上限に達して
      # アーカイブが失敗するため、"Created via API" の開発証明書だけを失効させる（人が作った証明書は対象外）。
      # 権限不足などで失敗しても、ビルド自体は続ける
      - name: CI 用の古い開発証明書を失効
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: python3 .github/scripts/ios-revoke-ci-certs.py

      - name: アーカイブ（署名あり）
        working-directory: frontend-ios-spike
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project NagiSpike.xcodeproj \
            -scheme NagiSpike \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Nagi.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee build/xcodebuild-archive.log | tail -n 40

      - name: ExportOptions.plist を生成
        working-directory: frontend-ios-spike
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: 書き出し・App Store Connect へアップロード
        working-directory: frontend-ios-spike
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Nagi.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/xcodebuild-export.log | tail -n 40

      - name: CI 用の開発証明書を後始末
        if: always()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: python3 .github/scripts/ios-revoke-ci-certs.py

      - name: API キーを削除
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-testflight-logs
          path: |
            frontend-ios-spike/build/xcodebuild-archive.log
            frontend-ios-spike/build/xcodebuild-export.log
            frontend-ios-spike/build/export/*.log
          if-no-files-found: ignore
