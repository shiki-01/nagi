name: NagiSpike

options:
  bundleIdPrefix: com.shiki.inputmethod
  deploymentTarget:
    iOS: "16.1"
  groupSortPosition: top

settings:
  PROVISIONING_PROFILE_SPECIFIER: ""
  DEVELOPMENT_TEAM: ""

attributes:
  ORGANIZATIONNAME: Shiki
  LastUpgradeCheck: "1500"
  LastSwiftMigration: "1500"

targets:
  NagiSpike:
    type: application
    platform: iOS
    deploymentTarget: "16.1"

    sources:
      - path: App
      - path: Shared
      - path: Resources/data
        type: folder
        optional: true
        buildPhase: resources

    dependencies:
      - target: NagiSpikeKeyboard
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      - framework: NagiCore.xcframework
        embed: false

    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nagi Spike
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ALTAppGroups:
          - group.com.shiki.nagi.spike

    entitlements:
      path: App/NagiSpike.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shiki.nagi.spike

    settings:
      SWIFT_VERSION: "5"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "NAGI_SPIKE_APP ${NAGI_LLM}"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.shiki.inputmethod.NagiSpike

    scheme:
      testTargets: []
      gatherCoverageData: false

  NagiSpikeKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    productName: NagiSpikeKeyboard

    sources:
      - path: Keyboard
      - path: Shared
      - path: Resources/data
        type: folder
        optional: true
        buildPhase: resources

    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      - framework: NagiCore.xcframework
        embed: false

    entitlements:
      path: Keyboard/NagiSpikeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shiki.nagi.spike

    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Nagi Spike Keyboard
        ALTAppGroups:
          - group.com.shiki.nagi.spike
        NSExtension:
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: false
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"

    settings:
      SWIFT_VERSION: "5"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "NAGI_SPIKE_KEYBOARD ${NAGI_LLM}"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.shiki.inputmethod.NagiSpike.Keyboard

    scheme:
      testTargets: []
      gatherCoverageData: false
