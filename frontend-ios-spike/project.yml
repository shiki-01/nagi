name: NagiSpike

options:
  bundleIdPrefix: com.shiki.inputmethod
  deploymentTarget:
    iOS: "16.1"
  groupSortPosition: top

settings:
  PROVISIONING_PROFILE_SPECIFIER: ""
  DEVELOPMENT_TEAM: ""

attributes:
  ORGANIZATIONNAME: Shiki
  LastUpgradeCheck: "1500"
  LastSwiftMigration: "1500"

targets:
  NagiSpike:
    type: application
    platform: iOS
    deploymentTarget: "16.1"

    sources:
      - path: App
      - path: Shared
      - path: Resources/data
        type: folder
        optional: true
        buildPhase: resources

    dependencies:
      - target: NagiSpikeKeyboard
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      # libnagi_ffi.a（llama.cpp + ggml-metal 入り）が要求するシステム依存。
      # llama-cpp-sys-2 の build.rs（Apple）の link-lib と同じ集合
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - framework: NagiCore.xcframework
        embed: false

    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nagi Spike
        # 独自の暗号化を使わない（TestFlight の輸出コンプライアンス質問を省略する）
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ALTAppGroups:
          - group.com.shiki01.nagi

    entitlements:
      path: App/NagiSpike.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shiki01.nagi

    settings:
      SWIFT_VERSION: "5"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "NAGI_SPIKE_APP ${NAGI_LLM}"
      OTHER_LDFLAGS: "$(inherited) -lc++"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.shiki01.nagi

    scheme:
      testTargets: []
      gatherCoverageData: false

  NagiSpikeKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    productName: NagiSpikeKeyboard

    sources:
      - path: Keyboard
      - path: Shared
      - path: Resources/data
        type: folder
        optional: true
        buildPhase: resources

    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      # libnagi_ffi.a（llama.cpp + ggml-metal 入り）が要求するシステム依存。
      # llama-cpp-sys-2 の build.rs（Apple）の link-lib と同じ集合
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - framework: NagiCore.xcframework
        embed: false

    entitlements:
      path: Keyboard/NagiSpikeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shiki01.nagi

    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Nagi Spike Keyboard
        ALTAppGroups:
          - group.com.shiki01.nagi
        NSExtension:
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: false
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"

    settings:
      SWIFT_VERSION: "5"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "NAGI_SPIKE_KEYBOARD ${NAGI_LLM}"
      OTHER_LDFLAGS: "$(inherited) -lc++"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.shiki01.nagi.keyboard

    scheme:
      testTargets: []
      gatherCoverageData: false
