name: NagiSpike

options:
  bundleIdPrefix: com.shiki.inputmethod
  deploymentTarget:
    iOS: "16.1"
  groupSortPosition: top

settings:
  PROVISIONING_PROFILE_SPECIFIER: ""
  DEVELOPMENT_TEAM: ""
  # CI（ios-testflight.yml）がコマンドラインで上書きする。ローカルビルド用の既定値
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

attributes:
  ORGANIZATIONNAME: Shiki
  LastUpgradeCheck: "1500"
  LastSwiftMigration: "1500"

targets:
  NagiSpike:
    type: application
    platform: iOS
    deploymentTarget: "16.1"

    sources:
      - path: App
      - path: Shared
      # コアのプロトコルの型（typeshare で生成。macOS フロントエンドと共有）
      - path: ../frontend-macos/Sources/Generated
      # 既定のキーボードレイアウト（JSON）。設定画面のレイアウト選択肢の列挙に使う
      - path: ../config/keyboard/presets
        type: folder
        buildPhase: resources
      - path: Resources/data
        type: folder
        optional: true
        buildPhase: resources

    dependencies:
      - target: NagiSpikeKeyboard
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      # libnagi_ffi.a（llama.cpp + ggml-metal 入り）が要求するシステム依存。
      # llama-cpp-sys-2 の build.rs（Apple）の link-lib と同じ集合
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - framework: NagiCore.xcframework
        embed: false

    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nagi Spike
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 独自の暗号化を使わない（TestFlight の輸出コンプライアンス質問を省略する）
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # nagi://layout?data=<base64url json> でレイアウトを取り込む（docs/ios-keyboard-layout.md）
        CFBundleURLTypes:
          - CFBundleURLName: com.shiki01.nagi
            CFBundleURLSchemes:
              - nagi
        # iPad のマルチタスクに対応するには 4 方向すべての宣言が必要（App Store Connect の検証）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ALTAppGroups:
          - group.com.shiki01.nagi

    entitlements:
      path: App/NagiSpike.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shiki01.nagi

    settings:
      SWIFT_VERSION: "5"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "NAGI_SPIKE_APP ${NAGI_LLM}"
      OTHER_LDFLAGS: "$(inherited) -lc++"
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.shiki01.nagi

    scheme:
      testTargets: []
      gatherCoverageData: false

  NagiSpikeKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    productName: NagiSpikeKeyboard

    sources:
      - path: Keyboard
      - path: Shared
      - path: ../frontend-macos/Sources/Generated
      # 既定のキーボードレイアウト（JSON）。バンドル内の presets/ フォルダとして同梱する
      - path: ../config/keyboard/presets
        type: folder
        buildPhase: resources
      - path: Resources/data
        type: folder
        optional: true
        buildPhase: resources

    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      # libnagi_ffi.a（llama.cpp + ggml-metal 入り）が要求するシステム依存。
      # llama-cpp-sys-2 の build.rs（Apple）の link-lib と同じ集合
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - framework: NagiCore.xcframework
        embed: false

    entitlements:
      path: Keyboard/NagiSpikeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shiki01.nagi

    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Nagi Spike Keyboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ALTAppGroups:
          - group.com.shiki01.nagi
        NSExtension:
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: false
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"

    settings:
      SWIFT_VERSION: "5"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "NAGI_SPIKE_KEYBOARD ${NAGI_LLM}"
      OTHER_LDFLAGS: "$(inherited) -lc++"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.shiki01.nagi.keyboard

    scheme:
      testTargets: []
      gatherCoverageData: false

  # 論理の単体テスト（.github/workflows/ios-test.yml）。XCFramework（Rust）に依存しない純粋な Swift だけを
  # テストバンドルへ直接コンパイルする（ホストアプリなしのロジックテスト）。
  # NagiCore.swift / NagiSession.swift などコアへ接続する層は含めない
  NagiSpikeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.1"

    sources:
      - path: Tests
      # テスト対象（外部リンクが要らないものだけ。SharedStore は AppGroupResolver / DataPaths に依存する）
      - path: Shared/KeyboardLayout.swift
      - path: Shared/IOSSettings.swift
      - path: Shared/DiagLog.swift
      - path: Shared/SharedStore.swift
      - path: Shared/AppGroupResolver.swift
      - path: Shared/DataPaths.swift
      - path: Keyboard/KanaKeyTable.swift
      # コアのプロトコルの型（typeshare で生成）
      - path: ../frontend-macos/Sources/Generated
      # 同梱レイアウト（JSON）の検証用。バンドル内の presets/ フォルダとして入る
      - path: ../config/keyboard/presets
        type: folder
        buildPhase: resources

    settings:
      SWIFT_VERSION: "5"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.shiki01.nagi.tests

    scheme:
      testTargets:
        - NagiSpikeTests
      gatherCoverageData: false
